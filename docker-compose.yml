services:
  db:
    image: pgvector/pgvector:pg16
    container_name: incidentforge_db
    environment:
      POSTGRES_USER: incidentforge
      POSTGRES_PASSWORD: forgepassword123
      POSTGRES_DB: incidentforge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentforge -d incidentforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: